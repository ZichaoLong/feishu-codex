name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Set up dependency lock resolver
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.14"
          enable-cache: false

      - name: Check Python dependency locks
        run: |
          bash scripts/lock-python-dependencies.sh
          git diff --exit-code -- requirements.lock requirements-dev.lock

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.lock

      - name: Check Python source
        run: |
          python -m ruff check bot tests scripts install.py
          python -m compileall -q bot tests scripts install.py

      - name: Enforce reviewed source-context baselines
        run: python scripts/check_source_context.py

      - name: Reject Python import cycles
        run: python scripts/check_import_cycles.py

      - name: Enforce Python dependency direction
        run: python scripts/check_dependency_direction.py

      - name: Check documentation contracts
        run: bash scripts/check-docs.sh

      - name: Run Python tests
        run: python -m pytest

  platform-contracts:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.lock

      - name: Run platform contract tests
        run: >-
          python -m pytest
          tests/test_platform_paths.py
          tests/test_instance_registry_store.py
          tests/test_service_instance_lease.py
          tests/test_app_server_runtime_store.py
          tests/test_owned_app_server_guard.py
          tests/test_codex_rpc_client_lifecycle.py
          tests/test_service_runtime_lifecycle.py
          tests/test_service_manager.py
          tests/test_install.py
          tests/build_support/test_python_distribution.py
          tests/manage_cli

  web-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Python for install bundle verification
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install Python bundle build dependencies
        run: python -m pip install -r requirements-dev.lock

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Enforce Focus Web dependency direction
        working-directory: web
        run: npm run check:dependency-direction

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Test
        working-directory: web
        run: npm test

      - name: Check style baseline
        working-directory: web
        run: npm run check:style

      - name: Fetch recorded Kimi provenance source
        working-directory: web
        shell: bash
        run: |
          upstream_url="$(node -p "require('./provenance/kimi-web-files.json').upstream.source_url")"
          upstream_commit="$(node -p "require('./provenance/kimi-web-files.json').upstream.imported_commit")"
          git init "${RUNNER_TEMP}/kimi-code"
          git -C "${RUNNER_TEMP}/kimi-code" remote add origin "${upstream_url}"
          git -C "${RUNNER_TEMP}/kimi-code" fetch --depth=1 origin "${upstream_commit}"

      - name: Verify Kimi provenance
        working-directory: web
        run: npm run check:kimi-provenance -- --upstream "${RUNNER_TEMP}/kimi-code"

      - name: Build production assets
        working-directory: web
        run: npm run build

      - name: Verify third-party notices
        working-directory: web
        run: npm run check:notices

      - name: Build and validate the installable artifact
        run: |
          python scripts/build_install_bundle.py --output-dir "${RUNNER_TEMP}/focus-install-first"
          python scripts/build_install_bundle.py --output-dir "${RUNNER_TEMP}/focus-install-second"
          cmp "${RUNNER_TEMP}"/focus-install-first/*.zip "${RUNNER_TEMP}"/focus-install-second/*.zip
          git diff --exit-code -- web/THIRD_PARTY_NOTICES.md
